[build]
  publish = "."

[[redirects]]
  from = "/api/media"
  to = "/.netlify/functions/media"
  status = 200
  force = true

# Media proxied from Drive: cacheable 1 day
[[headers]]
  for = "/api/media"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Everything else (HTML): always revalidate so deploys go live immediately
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"
