[build]
  publish = "."

[[redirects]]
  from = "/api/media"
  to = "/.netlify/functions/media"
  status = 200
  force = true

# Media proxied from Drive: cacheable 1 day
[[headers]]
  for = "/api/media"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Committed media (photos HEIC/JPG/PNG) are content-addressed by filename: cache forever
[[headers]]
  for = "/*.heic"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.HEIC"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.{jpg,jpeg,png}"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Everything else (HTML): always revalidate so deploys go live immediately
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"
